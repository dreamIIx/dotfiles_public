Section "InputClass"
	Identifier "touchpad"
	MatchIsTouchpad "on"
	MatchDevicePath "/dev/input/event*"
	Option "VertScrollDelta" "-111"
	Option "HorizScrollDelta" "-111"
	Option "Tapping" "on"
	Option "ClickMethod" "clickfinger"
	Option "DisableWhileTyping" "on"
	Option "NaturalScrolling" "true"
EndSection
