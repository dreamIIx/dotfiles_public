# Fonts
font_family      iosevka-term-extended
bold_font        auto
italic_font      auto
bold_italic_font auto
# font_size 10

disable_ligatures never

# Text cursor customization
# cursor_trail 1
# cursor_trail_decay 0.01 0.05

# Scrollback
scrollback_lines 30000
scrollback_indicator_opacity 1.0
pixel_scroll yes
momentum_scroll 0.

# Performance tuning
# repaint_delay 10
# input_delay 0
sync_to_monitor yes

# Terminal bell
enable_audio_bell no

# Window layout
# 0 disables it; -1 enables it
confirm_os_window_close 0

# Color scheme
# include ~/.cache/wal/colors-kitty.conf
foreground #BABABA
background #1C1E26

# black
color0   #131419
color8   #676767

# red 
color1   #E95678
color9   #EC6A88

# green
color2   #29D398
color10  #3FDAA4

# yellow
color3   #FAB795
color11  #FBC3A7

# blue
color4  #26BBD9
color12 #3FC6DE

# magenta
color5   #EE64AE
color13  #F075B7

# cyan
color6   #59E3E3
color14  #6BE6E6

# white
color7   #C7C7C7
color15  #FEFFFF

# foreground #dddddd
# background #1f1f1f
background_opacity 0.8
dynamic_background_opacity no
background_blur 32

# Advanced
shell .
editor .
allow_remote_control socket-only
listen_on unix:@mykitty
allow_hyperlinks yes
shell_integration enabled
notify_on_cmd_finish never
term xterm-kitty

# OS specific tweaks
linux_display_server auto

map kitty_mod+/      launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

map kitty_mod+. new_tab_with_cwd
map kitty_mod+, new_window_with_cwd
map kitty_mod+m new_os_window_with_cwd
map kitty_mod+x toggle_layout stack
map kitty_mod+left neighboring_window left
map kitty_mod+right neighboring_window right
map kitty_mod+down neighboring_window down
map kitty_mod+up neighboring_window up
map kitty_mod+q

map ctrl+shift+y>l kitten hints --type=line --program "@"
map ctrl+shift+y>w kitten hints --type=word --program "@"
map ctrl+shift+y>u kitten hints --type=url --program "@"

# Defaults (for reference)
map ctrl+shift+e open_url_with_hints
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>shift+f kitten hints --type path
map ctrl+shift+p>c kitten choose-files
map ctrl+shift+p>d kitten choose-files --mode=dir
map ctrl+shift+p>l kitten hints --type line --program -
map ctrl+shift+p>w kitten hints --type word --program -
map ctrl+shift+p>h kitten hints --type hash --program -
map ctrl+shift+p>n kitten hints --type linenum
map ctrl+shift+p>y kitten hints --type hyperlink
