monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*BTR17.*"
      }
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 1
      }
    }
  }
]

stream.rules = [
  {
    matches = [
      {
        application.name = "Audacious"
      }
      {
        application.name = "~[Ff]eishin.*"
      }
      {
        application.name = "pw-dsdplay"
      }
    ]
    actions = {
      update-props = {
        node.passthrough = true
        audio.position = [ AUX0 AUX1 ]
      }
    }
  }
]
