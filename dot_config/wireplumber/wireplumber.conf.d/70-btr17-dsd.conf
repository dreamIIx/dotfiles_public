monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*BTR17.*"
      }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*BTR17.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.headroom = 256
        audio.format = "SPECIAL DSD_U32_BE"
        # api.alsa.dsd-lsb = true
        priority.driver = 1500
        priority.session = 1500
      }
    }
  }
]

stream.rules = [
  {
    matches = [
      {
        application.name = "pw-dsdplay"
      }
    ]
    actions = {
      update-props = {
        node.passthrough = true
      }
    }
  }
]
