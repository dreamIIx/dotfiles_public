format-foreground = ${colors.background-alt}
format-margin-right = 1
label = ""
label-font = 7
label-padding = 0.5

[module/sep5l]
type = custom/text

format = <label>
format-background = ${colors.transparent}
format-foreground = ${colors.background}
; label = ""
label = ""
label-font = 7
label-padding = 0

[module/sep5r]
type = custom/text

format = <label>
format-background = ${colors.transparent}
format-foreground = ${colors.background}
; label = ""
label = ""
label-font = 7
label-padding = 0

[module/sep6r]
type = custom/text

format = <label>
format-background = ${colors.background}
format-foreground = ${colors.primary}
format-padding = 0
format-margin = 0
label = ""
label-font = 7
label-padding = 0

[module/sep7l]
type = custom/text

format = <label>
format-background = ${colors.background}
format-foreground = ${colors.background-alt}
format-padding = 0
format-margin = 0
label = ""
label-font = 7
label-padding = 0

[module/backlight_prefix]
type = custom/text

format = <label>
label = "󰃟"
format-background = ${colors.background}
format-foreground = ${colors.background-alt}
format-font = 8
format-margin = 0
label-padding = 0

[module/arch]
type = custom/text

format = <label>
; label = "󰣇"
label = ""
format-background = ${colors.primary}
format-foreground = ${colors.background}
; format-padding = 1
; format-margin-left = 1
format-font = 9
; format-margin = 0
label-padding-left = 1
click-left = echo "albafetch" | xargs -I{} kitty --hold {}

[module/systray]
type = internal/tray
format-background = ${colors.background}
format-foreground = ${colors.foreground}
format-padding = 0
format-margin = 0
; margin = 8pt
tray-background = ${colors.background}
tray-foreground = ${colors.foreground}
tray-spacing = 8pt
tray-position = left
tray-maxsize = 16

[module/active_window]
type = custom/script
format-background = ${colors.background-alt}
format-foreground = ${colors.background}
format-font = 8
format-padding = 2
format-margin = 0
format = <label>
label = %output%
exec = ~/.config/polybar/scripts/active_window.sh
interval = 1

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true

label-active = ●
label-active-background = ${colors.background}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = ◉
label-occupied-background = ${colors.background}
; label-occupied-underline= ${colors.foreground}
label-occupied-padding = 1

label-urgent = ▼
label-urgent-underline= ${colors.secondary}
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = ○
label-empty-background = ${colors.background}
; label-empty-underline= ${colors.foreground}
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/desk]
type = custom/ipc
format-background = #073642
format-foreground = #ffffff
format-padding = 1
initial = 1
hook-0 = echo $(($(xdotool get_desktop)+1))

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%

;[module/filesystem]
;type = internal/fs
;interval = 25

;mount-0 = /

;label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

;label-unmounted = %mountpoint% not mounted
;label-unmounted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
; blacklist-0 = num lock

format = <label-indicator> <label-layout>
format-spacing = 1
format-font = 6
format-background = ${colors.primary}
format-foreground = ${colors.foreground}

label-layout = %layout%
; label-indicator-on = %icon%
; label-indicator-off = %icon%
; indicator-icon-0 = caps lock;;󰘲
; indicator-icon-1 = scroll lock;;+SL
; indicator-icon-2 = num lock;;󰼏 
; label-indicator-on-capslock = 󰘲
; label-indicator-off-capslock = 
; label-indicator-on-numlock = 󰼏
; label-indicator-off-numlock = 
; label-indicator-on-scrolllock = ScrollLock
; label-indicator-off-scrolllock = 

[module/backlight]
type = internal/backlight

format-background = ${colors.background}
format-foreground = ${colors.foreground}

use-actual-brightness = false
; Use the following command to list available cards:
; $ ls -1 /sys/class/backlight/
; Default: first usable card in /sys/class/backlight (new in version 3.7.0)
card = amdgpu_bl2
; poll-interval = 5
; Do 'chmod +666 /sys/class/backlight/amdgpu_bl2/brightness'
enable-scroll = true
scroll-interval = 10
label-font = 5
format = <label>
label = %percentage%%
ramp-0 = 🌕
ramp-1 = 🌔
ramp-2 = 🌓
ramp-3 = 🌒
ramp-4 = 🌑
bar-width = 10
bar-indicator = |
bar-fill = ─
bar-empty = ─

[module/pulseaudio]
type = internal/pulseaudio
click-right = pavucontrol

format-volume-background = ${colors.background}
format-muted-background = ${colors.background}
format-volume = <label-volume>
format-volume-prefix-foreground = ${colors.background-alt}
format-volume-prefix = "󰕾 "
format-volume-font = 8
format-muted-font = 8
format-volume-prefix-padding-left = 1
format-muted-padding = 1
label-volume = %percentage:2%%
label-volume-font = 5

; ramp-volume-0 = 
; ramp-volume-1 = 
; ramp-volume-2 = 󰕾

label-muted = "󰖁   "
format-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 1
format = <label>
format-background = ${colors.primary}
; format-prefix-foreground = ${colors.background-alt}
format-prefix-background = ${colors.primary}
format-label-background = ${colors.primary}
format-label-margin-left = 0
format-label-padding-left = 0
format-prefix-margin-right = 0
format-prefix-padding-right = 1
format-prefix-font = 8

format-prefix = ""
label = %percentage_used:2%%
label-font = 5
; ramp-used-0 = ▁
; ramp-used-1 = ▂
; ramp-used-2 = ▃
; ramp-used-3 = ▄
; ramp-used-4 = ▅
; ramp-used-5 = ▆
; ramp-used-6 = ▇
; ramp-used-7 = █

[module/cpu]
type = internal/cpu
interval = 5
format = <label>
format-background = ${colors.primary}
; format-prefix-foreground = ${colors.background-alt}
format-prefix-background = ${colors.primary}
format-label-background = ${colors.primary}
label-margin-right = 0
label-padding-right = 1
format-prefix-margin-right = 0
format-prefix-padding-left = 1
format-prefix-padding-right = 0
format-prefix-font = 8

format-prefix = "󰍛"
label = %percentage:2%% 
label-font = 5
; ramp-coreload-spacing = 0
; ramp-coreload-0 = ▁
; ramp-coreload-1 = ▂
; ramp-coreload-2 = ▃
; ramp-coreload-3 = ▄
; ramp-coreload-4 = ▅
; ramp-coreload-5 = ▆
; ramp-coreload-6 = ▇
; ramp-coreload-7 = █
; ramp-load-0 = ▁
; ramp-load-1 = ▂
; ramp-load-2 = ▃
; ramp-load-3 = ▄
; ramp-load-4 = ▅
; ramp-load-5 = ▆
; ramp-load-6 = ▇
; ramp-load-7 = █

[module/docker]
type = custom/script
interval = 5

format-background = ${colors.background}
; format-foreground = ${colors.background}
label-padding-left = 0
format-font = 8

exec = ~/.config/polybar/scripts/docker.sh
label = %output%

[network-base]
type = internal/network
interval = 5
format-connected = <ramp-signal>
format-disconnected = <label-disconnected>
format-connected-background = ${colors.background}
format-disconnected-background = ${colors.background}
; format-connected-foreground = ${colors.background-alt}
; format-disconnected-foreground = ${colors.background-alt}
format-connected-font = 8
format-disconnected-font = 8

ramp-signal-padding-left = 1
label-connected-padding-left = 1
label-disconnected-padding-left = 1

[module/wlan]
inherit = network-base
interface-type = wireless

label-disconnected = "󰤮"
ramp-signal-0 = "󰤯😱"
ramp-signal-1 = "󰤟😠"
ramp-signal-2 = "󰤢😒"
ramp-signal-3 = "󰤥😊"
ramp-signal-4 = "󰤨😃"
ramp-signal-5 = "󰤨😈"
; %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired

format-connected = <label-connected>
label-connected-padding-right = 1
label-disconnected-padding-right = 1

label-connected = "󰈁"
label-disconnected = "󰈂"
; %local_ip%

[module/bluetooth]
type = custom/script
interval = 5

format-background = ${colors.background}
; format-rforeground = ${colors.background-alt}
format-font = 8
label-padding-right = 0

exec = ~/.config/polybar/scripts/polybar-bluetooth/bluetooth.sh
click-right  = exec blueman-manager
click-left = exec ~/.config/polybar/scripts/polybar-bluetooth/toggle_bluetooth.sh

[module/date]
type = internal/date
interval = 1

; format-background = ${colors.foreground}
; format-foreground = ${colors.background}
format-background = ${colors.primary}
format-foreground = ${colors.foreground}
label-padding-left = 1
; label-foreground = ${colors.primary}

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-font = 6

[module/date_alt]
type = internal/date
interval = 1

; format-background = ${colors.foreground}
; format-foreground = ${colors.background}
format-background = ${colors.background}
format-foreground = ${colors.background-alt}
label-padding-left = 0
; label-foreground = ${colors.primary}

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-font = 6

[module/battery]
; type = custom/script
; exec = ~/.config/polybar/scripts/battery.sh
type = internal/battery
interval = 10

format-full = <ramp-capacity>
format-low = <animation-low>
format-charging = <animation-charging>
format-discharging = <ramp-capacity>

format-background = ${colors.background-alt}
format-full-background = ${colors.background-alt}
format-low-background = ${colors.background-alt}
format-charging-background = ${colors.background-alt}
format-discharging-background = ${colors.background-alt}
format-foreground = ${colors.background}
format-full-foreground = ${colors.background}
format-low-foreground = ${colors.background}
format-charging-foreground = ${colors.background}
format-discharging-foreground = ${colors.background}
format-full-font = 8
format-low-font = 8
format-charging-font = 8
format-discharging-font = 8
; format-full-margin-right = 1
; format-full-padding-right = 1
; format-low-margin-right = 1
; format-low-padding-right = 1
; format-charging-margin-right = 1
; format-charging-padding-right = 1
; format-discharging-margin-right = 1
; format-discharging-padding-right = 1
ramp-capacity-padding-right = 1
ramp-capacity-padding-left = 0
animation-charging-padding-right = 1
animation-charging-padding-left = 0
animation-low-padding-right = 1
animation-low-padding-left = 0

full-at = 99
low-at = 5
; $ ls -1 /sys/class/power_supply/
battery = BAT1
adapter = ACAD
poll-interval = 5
ramp-capacity-0 = ""
ramp-capacity-1 = ""
ramp-capacity-2 = ""
ramp-capacity-3 = ""
ramp-capacity-4 = ""
bar-capacity-width = 10
animation-charging-0 = ""
animation-charging-1 = ""
animation-charging-2 = ""
animation-charging-3 = ""
animation-charging-4 = ""
animation-charging-framerate = 750
animation-discharging-0 = ""
animation-discharging-1 = ""
animation-discharging-2 = ""
animation-discharging-3 = ""
animation-discharging-4 = ""
animation-discharging-framerate = 500
animation-low-0 = " !"
animation-low-1 = "  "
animation-low-framerate = 200

[settings]
screenchange-reload = true
pseudo-transparency = true

