[colors]
background = ${xrdb:color0:#222}
foreground = ${xrdb:color7:#222}
background-alt = ${xrdb:color5:#222}
foreground-alt = ${xrdb:color7:#222}
primary = ${xrdb:color1:#222}
secondary = ${xrdb:color2:#222}
alert = ${xrdb:color3:#222}
c4 = ${xrdb:color4:#222}
c6 = ${xrdb:color6:#222}

disabled = #707880
transparent = #00000000

; background = ${xrdb:color7:#222}
; foreground = ${xrdb:color0:#222}
; background-alt = ${xrdb:color2:#222}
; foreground-alt = ${xrdb:color0:#222}
; primary = ${xrdb:color6:#222}
; secondary = ${xrdb:color5:#222}
; alert = ${xrdb:color4:#222}
; c4 = ${xrdb:color3:#222}
; c6 = ${xrdb:color1:#222}

[bar/root]
monitor = ${env:MONITOR:}

width = 100%
; 100%:-8
height = 23pt
; offset-x = 4pt
; offset-y = 2pt
radius = 4
fixed-center = true

; dpi = 96

background = ${colors.transparent}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 3pt
border-top-size = 3pt
border-bottom-size = 0pt
border-left-size = 3pt
border-right-size = 3pt
border-color = #00000000

; padding-left = 1
; padding-right = 1
; module-margin = 0
; margin-right = 0

separator = 
separator-foreground = ${colors.disabled}

; font-0 = monospace:size=13;1
font-0 = "Iosevka Term Extended;3"
font-1 = "Iosevka Term Extended:style=Bold;3"
font-2 = "Iosevka Nerd Font;3"
font-3 = NotoEmoji:scale=10;3
font-4 = "Iosevka Extended:size=11;4"
font-5 = "Iosevka Extended:size=11:style=Bold;3"
font-6 = "Symbols Nerd Font Mono:size=22.5;4"
font-7 = "Symbols Nerd Font Mono:size=11;3"
font-8 = "Symbols Nerd Font Mono:size=15;3"

; modules-left = arch sep6r systray sep7l active_window sep4r
; modules-center = sep5l xworkspaces sep5r
; modules-right = sep3l xkeyboard sep3r backlight_prefix backlight pulseaudio sep2l memory cpu sep2r docker wlan eth bluetooth sep0l date sep0r battery

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
wm-restack = bspwm
; wm-restack = i3

override-redirect = false

[bar/eDP-1]
inherit = bar/root

modules-left = arch sep6r systray sep7l active_window sep4r
modules-center = sep5l xworkspaces sep5r
modules-right = sep3l xkeyboard sep3r backlight_prefix backlight pulseaudio sep2l memory cpu sep2r docker wlan eth bluetooth sep0l date sep0r battery

[bar/DP-1]
inherit = bar/root

modules-left = arch sep6r systray sep7l active_window sep4r
modules-center = sep5l xworkspaces sep5r
modules-right = sep3l xkeyboard sep3r backlight_prefix backlight pulseaudio sep2l memory cpu sep2r docker wlan eth bluetooth sep0l date sep0r battery

[bar/HDMI-3]
inherit = bar/root

modules-left = systray sep7l active_window sep4r
modules-center = sep5l xworkspaces sep5r
modules-right = sep3l xkeyboard sep3r date_alt sep0r_alt battery

; modules-center = sep5l xworkspaces sep5r
;
; [bar/bar3]
; inherit = bar/root
; width = 40%
; offset-x = 60%
; background = ${colors.background}
;
; modules-right = tsep sep3l xkeyboard sep3r backlight_prefix backlight sep0 pulseaudio sep0 memory sep0 cpu sep0 wlan sep0 eth sep0 bluetooth sep0 sep1 date sep1 battery

[module/tsep]
type = custom/text

format = <label>
label = " "
; format-margin-left = 100
; format-padding-left = 100
format-background = ${colors.transparent}
format-foreground = ${colors.transparent}
label-padding = 0.5

[module/sep0l]
type = custom/text

format = <label>
; label = ""
label = ""
format-background = ${colors.background}
format-foreground = ${colors.primary}
label-padding = 0
format-font = 7

[module/sep0r]
type = custom/text

format = <label>
label = ""
format-background = ${colors.primary}
format-foreground = ${colors.background-alt}
label-padding = 0
format-font = 7

[module/sep0r_alt]
type = custom/text

format = <label>
label = ""
format-background = ${colors.background}
format-foreground = ${colors.background-alt}
label-padding = 0
format-font = 7

