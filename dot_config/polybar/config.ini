; label = "󰄮"
; label = "󰄱"
; label = "󰢡"
; label = "󰨔"
; label = "󱅊"
label = ""
format-background = ${colors.background}
format-foreground = ${colors.primary}
label-padding = 0
format-font = 7

[module/sep2l]
type = custom/text

format = <label>
label = ""
format-background = ${colors.background}
format-foreground = ${colors.primary}
label-padding = 0
format-font = 7

[module/sep2r]
type = custom/text

format = <label>
label = ""
format-background = ${colors.background}
format-foreground = ${colors.primary}
label-padding = 0
format-font = 7

[module/sep3l]
type = custom/text

format = <label>
format-background = ${colors.transparent}
format-foreground = ${colors.primary}
label = ""
label-font = 7
label-padding = 0

[module/sep3r]
type = custom/text

format = <label>
format-background = ${colors.background}
format-foreground = ${colors.primary}
; label = ""
label = ""
label-font = 7
label-padding = 0.5

[module/sep4r]
